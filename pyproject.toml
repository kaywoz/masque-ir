[project]
name = "masquer"
version = "0.0.1"
description = "Local pseudonymisation and defanging of Microsoft Defender exports for cloud LLM analysis"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Name-detection stage. On Linux, torch comes from the CPU-only index (the
# default PyPI build pulls several GB of CUDA libraries).
ner = ["gliner==0.2.30", "torch>=2.4"]
# Guided TUI (masquer with no arguments). Pure Python; the release attaches
# these wheels for installs without PyPI.
tui = ["textual>=8.2"]

[project.scripts]
masquer = "masquer.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/masquer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
