[project]
name = "masquer"
version = "0.0.1"
description = "Local pseudonymisation and defanging of Microsoft Defender exports for cloud LLM analysis"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
masquer = "masquer.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/masquer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
